[package]
name = "erp-agent-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
deadpool-postgres = "0.14"
dotenvy = "0.15"
email_address = "0.2"
erp-ingestion = { path = "../ingestion-worker" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
hex = "0.4"
libc = "0.2"
rand = "0.8"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "signal", "time", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 0
