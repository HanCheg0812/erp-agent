[package]
name = "erp-agent-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
rmcp = { version = "3.4.0", features = ["transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[profile.dev]
debug = 0
