name: erp-agent
services:
  postgres:
    image: pgvector/pgvector:pg17-bookworm
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run dev:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run dev:init}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run dev:init}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Run npm run dev:init}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Run npm run dev:init}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    command: ["/data"]
    ports:
      - "127.0.0.1:${RUSTFS_S3_PORT:-9020}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9021}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/health/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  tei:
    profiles: [embedding]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - ${TEI_MODEL_ID:-BAAI/bge-m3}
      - --revision
      - ${TEI_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      - --max-client-batch-size
      - "16"
      - --max-concurrent-requests
      - "32"
      - --max-batch-tokens
      - "4096"
    ports:
      - "127.0.0.1:${TEI_PORT:-8080}:80"
    volumes:
      - tei-model-cache:/data
    restart: unless-stopped
volumes:
  postgres-data:
  rustfs-data:
  tei-model-cache:
