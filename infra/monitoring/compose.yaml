name: forge-agent-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-29190}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:${ALERTMANAGER_PORT:-29193}
      - --cluster.listen-address=127.0.0.1:29094
      - --cluster.advertise-address=127.0.0.1:29094
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    network_mode: host
    command:
      - --config.file=/config/blackbox.yml
      - --web.listen-address=127.0.0.1:29115
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    user: "${MONITORING_HOST_UID:-1000}:${MONITORING_HOST_GID:-1000}"
    read_only: true
    command:
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/host/textfile
      - --web.listen-address=127.0.0.1:29100
    volumes:
      - /:/host/root:ro,rslave
      - ../../.runtime/monitoring/textfile:/host/textfile:ro
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    network_mode: host
    environment:
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME:?Run npm run monitoring:configure}
    command:
      - --web.listen-address=127.0.0.1:29187
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-13200}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Run npm run monitoring:configure}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run npm run monitoring:configure}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
